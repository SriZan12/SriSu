name: SriSu frontend checks

on:
  push:
    branches: [dev-new-theme, codex/workspace-integration]
  pull_request:
    branches: [dev-new-theme]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13.5'
      - name: Validate theme
        run: python tools/theme/check_theme.py
      - name: Test and compile Android
        run: ./gradlew :composeApp:testDebugUnitTest :composeApp:compileDebugKotlinAndroid --no-daemon --max-workers=2 --console=plain

  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Compile iOS simulator target
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64 --no-daemon --max-workers=2 --console=plain
