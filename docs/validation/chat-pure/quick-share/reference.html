#srisu-quick-share-illustrated {--pm-bg:light-dark(#ffffff,#17181b);--pm-ink:light-dark(#252629,#f1f2f4);--pm-muted:light-dark(#707278,#aeb1b9);--pm-fill:light-dark(#f2f3f5,#2b2d33);--pm-line:light-dark(#e9eaed,#35363c);--pm-out:light-dark(#2c2e34,#e3e5ec);--pm-out-ink:light-dark(#ffffff,#25262b);--pm-spark:light-dark(#f7f5fb,#302c39);--pm-spark-ink:light-dark(#6a587e,#d7c7e9);--pm-shade:light-dark(#17181b26,#00000066);}
#srisu-quick-share-illustrated .pm-stage {min-height:830px;padding:20px 8px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;box-sizing:border-box;}
#srisu-quick-share-illustrated .pm-phone {width:min(393px,100%);height:780px;position:relative;overflow:hidden;background:var(--pm-bg);color:var(--pm-ink);border:1px solid var(--pm-line);border-radius:30px;font-family:'SriSu Satoshi',system-ui,sans-serif;font-size:16px;line-height:1.4;box-shadow:0 10px 36px #0000000a;}
#srisu-quick-share-illustrated .pm-phone * {box-sizing:border-box;}
#srisu-quick-share-illustrated .pm-phone button {font:inherit;color:inherit;appearance:none;border:0;background:transparent;padding:0;}
#srisu-quick-share-illustrated .pm-phone button:focus-visible {outline:2px solid var(--pm-spark-ink);outline-offset:3px;}
#srisu-quick-share-illustrated .pm-phone button:disabled {opacity:.48;}
#srisu-quick-share-illustrated .pm-phone svg {width:22px;height:22px;stroke-width:1.7;flex-shrink:0;}
#srisu-quick-share-illustrated .pm-chat {height:100%;display:flex;flex-direction:column;}
#srisu-quick-share-illustrated .pm-status {padding:14px 25px 5px;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:500;}
#srisu-quick-share-illustrated .pm-signals {display:flex;gap:6px;align-items:center;}
#srisu-quick-share-illustrated .pm-signals svg {width:15px;height:15px;}
#srisu-quick-share-illustrated .pm-header {display:flex;align-items:center;gap:12px;padding:12px 10px 15px;}
#srisu-quick-share-illustrated .pm-phone .pm-icon {width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex-shrink:0;}
#srisu-quick-share-illustrated .pm-identity {flex:1;display:flex;align-items:center;gap:11px;justify-content:center;}
#srisu-quick-share-illustrated .pm-avatar {width:32px;height:32px;display:grid;place-items:center;background:var(--pm-fill);border-radius:50%;font-family:'SriSu Serif',Georgia,serif;font-size:21px;}
#srisu-quick-share-illustrated .pm-name {font-size:17px;font-weight:500;line-height:1.3;}
#srisu-quick-share-illustrated .pm-online {font-size:11px;color:var(--pm-muted);margin-top:2px;}
#srisu-quick-share-illustrated .pm-thread {padding:21px 18px;display:flex;flex-direction:column;gap:16px;flex:1;}
#srisu-quick-share-illustrated .pm-day {text-align:center;color:var(--pm-muted);font-size:11px;margin:0 0 8px;}
#srisu-quick-share-illustrated .pm-msg {max-width:84%;align-self:flex-start;}
#srisu-quick-share-illustrated .pm-msg.own {align-self:flex-end;text-align:right;}
#srisu-quick-share-illustrated .pm-bubble {padding:9px 14px;border-radius:20px 20px 20px 6px;background:var(--pm-fill);text-align:left;font-size:16px;line-height:1.48;}
#srisu-quick-share-illustrated .pm-msg.own .pm-bubble {border-radius:20px 20px 6px 20px;background:var(--pm-out);color:var(--pm-out-ink);}
#srisu-quick-share-illustrated .pm-meta {font-size:11px;color:var(--pm-muted);margin:5px 4px 0;}
#srisu-quick-share-illustrated .pm-composer {display:flex;align-items:center;margin:8px 12px 0;background:var(--pm-fill);border-radius:28px;padding:4px;gap:1px;}
#srisu-quick-share-illustrated .pm-placeholder {flex:1;color:var(--pm-muted);font-size:16px;min-width:0;padding-left:4px;}
#srisu-quick-share-illustrated .pm-phone .pm-mic {background:var(--pm-out);color:var(--pm-out-ink);}
#srisu-quick-share-illustrated .pm-home {height:4px;width:120px;background:var(--pm-ink);border-radius:4px;margin:18px auto 10px;flex-shrink:0;}
#srisu-quick-share-illustrated .pm-overlay {position:absolute;inset:0;display:flex;align-items:flex-end;z-index:2;}
#srisu-quick-share-illustrated .pm-backdrop {position:absolute;inset:0;background:var(--pm-shade)!important;width:100%;height:100%;}
#srisu-quick-share-illustrated .pm-sheet {position:relative;width:100%;background:var(--pm-bg);border-radius:28px 28px 0 0;padding:9px 20px 0;box-shadow:0 -4px 28px #00000009;}
#srisu-quick-share-illustrated .pm-handle {width:32px;height:4px;margin:0 auto 10px;border-radius:4px;background:var(--pm-line);}
#srisu-quick-share-illustrated .pm-heading {display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 15px;}
#srisu-quick-share-illustrated .pm-heading h2 {font:500 21px/1.3 'SriSu Satoshi',system-ui,sans-serif;letter-spacing:-.45px;margin:0;}
#srisu-quick-share-illustrated .pm-phone .pm-close {width:44px;height:44px;background:transparent;position:relative;}
#srisu-quick-share-illustrated .pm-close::before {content:"";position:absolute;inset:4px;border-radius:50%;background:var(--pm-fill);}
#srisu-quick-share-illustrated .pm-close svg {width:18px;height:18px;position:relative;}
#srisu-quick-share-illustrated .pm-section-label {font-size:11px;color:var(--pm-muted);letter-spacing:.8px;text-transform:uppercase;margin:0 0 12px;font-weight:500;}
#srisu-quick-share-illustrated .pm-shortcuts {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 -6px 24px;}
#srisu-quick-share-illustrated .pm-shortcut {display:flex;flex-direction:column;align-items:center;gap:8px;min-height:82px;font-size:13px!important;border-radius:14px;}
#srisu-quick-share-illustrated .pm-icon-disc {height:54px;width:54px;background:var(--pm-fill);border-radius:50%;display:grid;place-items:center;}
#srisu-quick-share-illustrated .pm-divider {height:1px;background:var(--pm-line);margin-bottom:22px;}
#srisu-quick-share-illustrated .pm-action-rows {display:flex;flex-direction:column;gap:4px;margin:0 -4px 18px;}
#srisu-quick-share-illustrated .pm-action-row {display:flex;align-items:center;gap:13px;width:100%;min-height:65px;text-align:left;border-radius:14px;padding:6px 4px!important;}
#srisu-quick-share-illustrated .pm-feature-icon {width:42px;height:42px;border-radius:13px;background:var(--pm-fill);display:grid;place-items:center;flex-shrink:0;}
#srisu-quick-share-illustrated .pm-spark {background:var(--pm-spark);color:var(--pm-spark-ink);}
#srisu-quick-share-illustrated .pm-action-copy {flex:1;min-width:0;}
#srisu-quick-share-illustrated .pm-action-title {display:block;font-size:16px;font-weight:500;}
#srisu-quick-share-illustrated .pm-action-detail {display:block;font-size:12px;color:var(--pm-muted);margin-top:3px;line-height:1.4;}
#srisu-quick-share-illustrated .pm-action-row > svg {width:17px;height:17px;color:var(--pm-muted);}
#srisu-quick-share-illustrated .pm-media-grid {display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;}
#srisu-quick-share-illustrated .pm-media-grid button {display:flex;align-items:center;gap:12px;min-height:60px;padding:12px 15px;border-radius:16px;background:var(--pm-fill);font-size:14px;}
#srisu-quick-share-illustrated .pm-feature-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 24px;}
#srisu-quick-share-illustrated .pm-feature-grid button {display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:94px;border-radius:17px;background:var(--pm-fill);font-size:13px;}
#srisu-quick-share-illustrated .pm-feature-grid button[data-action="Spark"] {background:var(--pm-spark);color:var(--pm-spark-ink);}
#srisu-quick-share-illustrated .pm-feature-grid .pm-planned-label {font-size:11px;line-height:1;color:var(--pm-muted);margin-top:-5px;}
#srisu-quick-share-illustrated .pm-list {margin:0 -4px 15px;display:flex;flex-direction:column;}
#srisu-quick-share-illustrated .pm-list button {min-height:51px;width:100%;display:flex;align-items:center;gap:18px;padding:10px 4px;border-radius:10px;text-align:left;font-size:16px;}
#srisu-quick-share-illustrated .pm-list button > span:first-of-type {flex:1;}
#srisu-quick-share-illustrated .pm-list [data-action="Spark"] > svg {color:var(--pm-spark-ink);}
#srisu-quick-share-illustrated .pm-list .pm-planned-label {font-size:11px;color:var(--pm-muted);}
#srisu-quick-share-illustrated .pm-plain .pm-divider {margin:0 0 20px;}
#srisu-quick-share-illustrated .pm-plain .pm-section-label {margin-bottom:4px;}
#srisu-quick-share-illustrated .pm-toast {position:absolute;left:18px;right:18px;top:124px;background:var(--pm-out);color:var(--pm-out-ink);font-size:13px;padding:12px 15px;border-radius:14px;z-index:5;box-shadow:0 3px 20px #0002;}
#srisu-quick-share-illustrated [hidden] {display:none!important;}
#srisu-quick-share-illustrated .pm-action-row:active,#srisu-quick-share-illustrated .pm-list button:active {background:var(--pm-fill);}
#srisu-quick-share-illustrated .pm-shortcut:active .pm-icon-disc,#srisu-quick-share-illustrated .pm-media-grid button:active,#srisu-quick-share-illustrated .pm-feature-grid button:active {filter:brightness(.96);}
@media(max-width:370px){#srisu-quick-share-illustrated .pm-stage {padding:12px 0;min-height:822px;}#srisu-quick-share-illustrated .pm-phone{border-radius:24px;}#srisu-quick-share-illustrated .pm-sheet{padding-left:17px;padding-right:17px;}#srisu-quick-share-illustrated .pm-action-detail{font-size:11.5px;}#srisu-quick-share-illustrated .pm-icon-disc{width:50px;height:50px;}#srisu-quick-share-illustrated .pm-shortcuts{gap:4px;}#srisu-quick-share-illustrated .pm-shortcut{font-size:12px!important;}#srisu-quick-share-illustrated .pm-feature-grid{gap:7px;}}
@media(prefers-reduced-motion:no-preference){#srisu-quick-share-illustrated .pm-overlay.pm-enter .pm-sheet{animation:pm-sheet-in .24s cubic-bezier(.2,.8,.2,1);}@keyframes pm-sheet-in{from{transform:translateY(24px);}to{transform:translateY(0);}}}

#srisu-quick-share-illustrated .pm-art {display:none;width:62px;height:62px;background-image:var(--pm-atlas);background-size:186px 186px;background-repeat:no-repeat;flex-shrink:0;}
#srisu-quick-share-illustrated .pm-line-icon {display:grid;place-items:center;}
#srisu-quick-share-illustrated.pm-illustrated .pm-art {display:block;}
#srisu-quick-share-illustrated.pm-illustrated .pm-line-icon {display:none;}
#srisu-quick-share-illustrated .pm-icon-disc,#srisu-quick-share-illustrated .pm-feature-icon {position:relative;}
#srisu-quick-share-illustrated.pm-illustrated .pm-icon-disc,#srisu-quick-share-illustrated.pm-illustrated .pm-feature-icon {background:transparent;}
#srisu-quick-share-illustrated.pm-illustrated .pm-art {position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);}
#srisu-quick-share-illustrated .pm-feature-icon .pm-art {width:51px;height:51px;background-size:153px 153px;}
#srisu-quick-share-illustrated .pm-art-Photos {background-position:-4px -8px;}
#srisu-quick-share-illustrated .pm-art-Camera {background-position:-62px -7px;}
#srisu-quick-share-illustrated .pm-art-Video {background-position:-123px -6px;}
#srisu-quick-share-illustrated .pm-art-Voice {background-position:-3px -64px;}
#srisu-quick-share-illustrated .pm-art-Spark {background-position:-51px -52px;}
#srisu-quick-share-illustrated .pm-art-Challenge {background-position:-101px -52px;}
#srisu-quick-share-illustrated .pm-art-Plan {background-position:-2px -99px;}
#srisu-quick-share-illustrated .pm-art-Ask {background-position:-51px -99px;}
#srisu-quick-share-illustrated .pm-art-Poll {background-position:-101px -99px;}
</style>
<div id="srisu-quick-share-illustrated" aria-label="Quick Share icon style">
  <div class="viz-dotted-background" aria-label="Quick Share illustrated preview">
    <section aria-label="Quick share menu"><div class="pm-stage"><div class="pm-phone" data-layout="hybrid" aria-label="Quick share phone preview"></div></div></section>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('srisu-quick-share-illustrated');
  const settings = { illustrated: true, planned: false, dark: matchMedia("(prefers-color-scheme: dark)").matches };
  const saved = window.openai?.widgetState;
  if (typeof saved?.privateContent?.planned === 'boolean') settings.planned = saved.privateContent.planned;
  if (typeof saved?.privateContent?.dark === 'boolean') settings.dark = saved.privateContent.dark;
  if (typeof saved?.privateContent?.illustrated === 'boolean') settings.illustrated = saved.privateContent.illustrated;
  const media = [
    { name:'Photos', icon:'image', description:'Choose from your library', destination:'Photos → photo library' },
    { name:'Camera', icon:'camera', description:'Capture this moment', destination:'Camera → take a photo' },
    { name:'Video', icon:'video', description:'Share a video', destination:'Video → video library' },
    { name:'Voice', icon:'mic', description:'Record a voice message', destination:'Voice → voice recorder' }
  ];
  const activities = [
    { name:'Spark', icon:'sparkles', description:'A question for the two of you', destination:'Spark → browse Sparks' },
    { name:'Challenge', icon:'sun', description:'Try something new together', destination:'Challenge → browse challenges' },
    { name:'Plan', icon:'calendar-days', description:'Make time for each other', destination:'Plan → your plans' },
    { name:'Ask', icon:'message-circle', description:'Ask an open question', destination:'Ask · future concept', planned:true },
    { name:'Poll', icon:'chart-no-axes-column', description:'Decide something together', destination:'Poll · future concept', planned:true }
  ];
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const illustratedIcon = item => `<span class="pm-art pm-art-${item.name}" aria-hidden="true"></span><span class="pm-line-icon" aria-hidden="true">${icon(item.icon)}</span>`;
  const attrs = item => `type="button" data-action="${item.name}"${item.planned ? ' data-planned hidden disabled aria-label="'+item.name+', planned feature"' : ''}`;
  const group = '<div class="pm-section-label">Together</div>';
  root.querySelectorAll('.pm-phone').forEach(phone => {
    const layout = phone.dataset.layout;
    let contents;
    if (layout === 'hybrid') {
      contents = `<div class="pm-shortcuts">${media.map(item => `<button ${attrs(item)} class="pm-shortcut cursor-interaction"><span class="pm-icon-disc">${illustratedIcon(item)}</span><span>${item.name}</span></button>`).join('')}</div><div class="pm-divider"></div>${group}<div class="pm-action-rows">${activities.map(item => `<button ${attrs(item)} class="pm-action-row cursor-interaction"><span class="pm-feature-icon ${item.name==='Spark'?'pm-spark':''}">${illustratedIcon(item)}</span><span class="pm-action-copy"><span class="pm-action-title">${item.name}${item.planned?' · Planned':''}</span><span class="pm-action-detail">${item.description}</span></span>${icon('chevron-right')}</button>`).join('')}</div>`;
    } else if (layout === 'grid') {
      contents = `<div class="pm-media-grid">${media.map(item => `<button ${attrs(item)} class="cursor-interaction">${icon(item.icon)}<span>${item.name}</span></button>`).join('')}</div>${group}<div class="pm-feature-grid">${activities.map(item => `<button ${attrs(item)} class="cursor-interaction">${icon(item.icon)}<span>${item.name}</span>${item.planned?'<span class="pm-planned-label">Planned</span>':''}</button>`).join('')}</div>`;
    } else {
      contents = `<div class="pm-section-label">Share media</div><div class="pm-list">${media.map(item => `<button ${attrs(item)} class="cursor-interaction">${icon(item.icon)}<span>${item.name}</span></button>`).join('')}</div><div class="pm-divider"></div>${group}<div class="pm-list">${activities.map(item => `<button ${attrs(item)} class="cursor-interaction">${icon(item.icon)}<span>${item.name}</span>${item.planned?'<span class="pm-planned-label">Planned</span>':''}</button>`).join('')}</div>`;
    }
    phone.innerHTML = `<div class="pm-chat" inert><div class="pm-status"><span>9:41</span><span class="pm-signals">${icon('signal')}${icon('wifi')}${icon('battery-full')}</span></div><header class="pm-header"><button class="pm-icon cursor-interaction" type="button" aria-label="Back">${icon('chevron-left')}</button><div class="pm-identity"><div class="pm-avatar">A</div><div><div class="pm-name">Aatithi</div><div class="pm-online">Online</div></div></div><button class="pm-icon cursor-interaction" type="button" aria-label="Chat appearance">${icon('ellipsis')}</button></header><div class="pm-thread"><div class="pm-day">Today</div><div class="pm-msg"><div class="pm-bubble">Saved you the last momo.</div><div class="pm-meta">6:44 PM</div></div><div class="pm-msg own"><div class="pm-bubble">On my way ♡</div><div class="pm-meta">Read &nbsp;6:45 PM</div></div><div class="pm-msg"><div class="pm-bubble">What should we do this weekend?</div><div class="pm-meta">6:46 PM</div></div></div><div class="pm-composer"><button class="pm-icon cursor-interaction" type="button" data-open aria-label="Open share menu">${icon('plus')}</button><span class="pm-placeholder">Message Aatithi</span><button class="pm-icon pm-mic cursor-interaction" type="button" aria-label="Record voice message" data-action="Voice">${icon('mic')}</button></div><div class="pm-home"></div></div><div class="pm-overlay"><button class="pm-backdrop cursor-interaction" type="button" aria-label="Dismiss share menu" data-close></button><section class="pm-sheet ${layout==='list'?'pm-plain':''}" role="dialog" aria-modal="true" aria-label="Share something"><div class="pm-handle" aria-hidden="true"></div><div class="pm-heading"><h2>Share something</h2><button class="pm-icon pm-close cursor-interaction" type="button" aria-label="Close share menu" data-close>${icon('x')}</button></div>${contents}<div class="pm-home"></div></section></div><div class="pm-toast" role="status" hidden></div>`;
    const overlay = phone.querySelector('.pm-overlay');
    const chat = phone.querySelector('.pm-chat');
    const toast = phone.querySelector('.pm-toast');
    let toastTimer;
    function close() { overlay.hidden = true; chat.inert = false; phone.querySelector('[data-open]').focus(); }
    phone.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', close));
    phone.querySelector('[data-open]').addEventListener('click', () => {
      chat.inert = true; overlay.hidden = false; overlay.classList.add('pm-enter'); toast.hidden = true;
      overlay.querySelector('.pm-close').focus();
    });
    phone.addEventListener('keydown', event => { if (event.key==='Escape' && !overlay.hidden) { event.preventDefault(); close(); } });
    phone.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', () => {
      const item = [...media,...activities].find(action => action.name===button.dataset.action);
      clearTimeout(toastTimer); toast.textContent=item.destination; toast.hidden=false;
      toastTimer=setTimeout(() => {toast.hidden=true;},2000);
    }));
  });
  function render() {
    root.classList.toggle('pm-illustrated', settings.illustrated);
    root.style.colorScheme = settings.dark ? 'dark' : 'light';
    root.querySelectorAll('[data-planned]').forEach(item => { item.hidden = !settings.planned; });
  }
  render();
  if (globalThis.lucide) lucide.createIcons({attrs:{width:22,height:22}});
  if (globalThis.Tweak) {
    const tweak = new Tweak({container:root,onChange:() => {
      render();
      window.openai?.setWidgetState?.({modelContent:{layout:'Quick Share',illustratedIcons:settings.illustrated,includePlannedActions:settings.planned},privateContent:{illustrated:settings.illustrated,planned:settings.planned,dark:settings.dark}})?.catch(() => {});
    }});
    tweak.addToggle(settings,'illustrated',{label:'Illustrated icons'});
    tweak.addToggle(settings,'planned',{label:'Preview planned Ask & Poll'});
    tweak.addToggle(settings,'dark',{label:'Dark appearance'});
  }
  window.addEventListener('openai:set_globals', event => {
    const state=event.detail?.globals?.widgetState?.privateContent;
    if (typeof state?.illustrated==='boolean') settings.illustrated=state.illustrated;
    if (typeof state?.planned==='boolean') settings.planned=state.planned;
    if (typeof state?.dark==='boolean') settings.dark=state.dark;
    render();
  });
})();
</script>
